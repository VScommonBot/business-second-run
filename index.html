  <style>.boot-progress{display:block;width:min(240px,70vw);height:8px;margin:16px auto 0;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}.boot-progress i{display:block;height:100%;width:4%;border-radius:inherit;background:linear-gradient(90deg,#ffd75e,#ffb12b);transition:width .4s}.boot-retry{margin:16px auto 0;min-height:44px;padding:0 22px;border-radius:14px;border:2.5px solid #12124a;background:linear-gradient(180deg,#fff0a0,#ffc93c);color:#3b2300;font-weight:900;font-size:15px;cursor:pointer}</style>
  <script>
  /* 첫 화면 로딩 감시: 느린 연결에서는 진행률을 보여 주고, 게임 파일 하나라도 받지 못하면 멈춘 화면 대신 한 번 자동으로 다시 받은 뒤 '다시 시도' 버튼을 보여 줍니다 */
  (function(){
   var t0=Date.now(),settled=false,timer=null,total=61;
   try{total=Object.keys(JSON.parse(document.querySelector('script[type=importmap]').textContent).imports).length+4}catch(e){}
   function box(){return document.querySelector('#app .loading')}
   function loaded(){try{return performance.getEntriesByType('resource').filter(function(e){return /\/games\/modoostartup\/[\w-]+\.(js|json)\?v=/.test(e.name)}).length}catch(e){return 0}}
   function retryButton(b){if(b&&!b.querySelector('.boot-retry')){var r=document.createElement('button');r.type='button';r.className='boot-retry';r.textContent='다시 시도';r.onclick=function(){location.reload()};b.appendChild(r)}}
   function tick(){
    if(settled)return;var b=box();if(!b){stop();return}
    var sec=(Date.now()-t0)/1000;if(sec<3)return;
    var pct=Math.max(4,Math.min(98,Math.round(loaded()/total*100)));
    if(!b.querySelector('.boot-progress')){var g=document.createElement('span');g.className='boot-progress';g.setAttribute('role','progressbar');g.setAttribute('aria-label','게임 파일 받는 중');g.innerHTML='<i></i>';b.appendChild(g)}
    b.querySelector('.boot-progress i').style.width=pct+'%';b.querySelector('.boot-progress').setAttribute('aria-valuenow',pct);
    var p=b.querySelector('p');if(p)p.textContent=sec<12?'게임 파일을 받고 있어요. '+pct+'%':'연결이 느려 조금 더 걸리고 있어요. '+pct+'%';
    if(sec>40)retryButton(b);
   }
   function stop(){settled=true;if(timer)clearInterval(timer)}
   window.__modooBoot={ready:stop,fail:function(){
    if(settled)return;stop();var again=false;try{again=!sessionStorage.getItem('modoo-boot-retry');if(again)sessionStorage.setItem('modoo-boot-retry','1')}catch(e){}
    var b=box()||document.getElementById('app');if(!b)return;
    if(again){b.innerHTML='<strong>모두의 창업</strong><p>연결이 잠깐 끊겨서 다시 받고 있어요.</p>';setTimeout(function(){location.reload()},1200);return}
    b.innerHTML='<strong>게임 파일을 다 받지 못했어요.</strong><p>인터넷 연결을 확인한 뒤 다시 시도해 주세요. 저장한 게임은 그대로 남아 있어요.</p>';b.setAttribute('role','alert');retryButton(b);
   }};
   timer=setInterval(tick,700);
  })();
  </script>
  <script type="module" src="life.js?v=30" onerror="window.__modooBoot&&window.__modooBoot.fail()"></script>
